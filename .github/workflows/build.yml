name: OrangeFox Recovery (RMXTARO / GT Neo5)

# Needed so the successful build can create a prerelease and upload its
# assets. actions/checkout only needs contents: read, which is implied.
permissions:
  contents: write

on:
  push:
    branches: [main, master, fox-12.1]
  workflow_dispatch:
  # Intentionally NO `release: published` trigger: creating a release from
  # this job would start ANOTHER ~2h build of the exact same commit.
  # The build publishes its own prerelease instead (see the last step).

jobs:
  build:
    runs-on: ubuntu-22.04
    # A previous run hung at 42% for 30+ min with zero output. Cap the job
    # so a stall does not silently consume the full 6h runner allowance.
    # -j1 is intentionally slower than -j2, so leave 150 min for the build
    # step and another 30 min for log/artifact upload.
    timeout-minutes: 180
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      # IMPORTANT: Do NOT use easimon/maximize-build-space here.
      # A previous run used root-reserve-mb: 2048, which shrank the root
      # filesystem to 2 GB. The runner itself lives at
      # /home/runner/actions-runner and could no longer write its own
      # _diag/Worker_*.log, so the Worker process crashed with
      # "System.IO.IOException: No space left on device" and the job was
      # killed mid-step (step 4 stuck at in_progress).
      # We only delete unused preinstalled toolchains - no LVM repartition.
      - name: Free disk space (safe cleanup, no repartition)
        run: |
          echo "=== BEFORE ==="
          df -h / /mnt || true
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/.ghcup \
                      /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell \
                      /usr/share/swift 2>/dev/null || true
          sudo apt-get clean
          echo "=== AFTER ==="
          df -h / /mnt || true

      - name: Add swap (safe, no repartition)
        run: |
          echo "=== memory before ==="
          free -h
          swapon --show || true
          # GitHub runners often have little/no swap; adding a plain swapfile
          # (NOT an LVM repartition) gives the linker headroom on 7 GB RAM.
          if [ ! -f /swapfile_extra ]; then
            sudo fallocate -l 8G /swapfile_extra 2>/dev/null \
              || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=8192 status=none
            sudo chmod 600 /swapfile_extra
            sudo mkswap /swapfile_extra >/dev/null 2>&1 || true
            sudo swapon /swapfile_extra 2>/dev/null \
              || echo "swapon unavailable (container restriction) - continuing"
          fi
          echo "=== memory after ==="
          free -h
          swapon --show || true
          df -h / || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            openjdk-17-jdk python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Install repo tool
        run: |
          mkdir -p ~/.bin
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod +x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Set up OrangeFox source (fox_12.1 manifest / R12.0 UI)
        run: |
          set +e
          git clone --depth 1 https://gitlab.com/OrangeFox/sync.git "$HOME/ofsync" \
            || { echo "ERROR: cannot clone OrangeFox sync repo"; exit 1; }
          cd "$HOME/ofsync" || exit 1
          # orangefox_sync.sh REQUIRES an absolute path for --path.
          # AOSP mirrors intermittently answer HTTP 503 for one or two
          # projects (run 9: external/protobuf + system/libvintf), aborting
          # the entire 2h build before any of our own code is ever touched.
          # `repo sync` is incremental, so re-running only refetches the
          # failed projects - no need to wipe and re-download the tree.
          RC=1
          for attempt in 1 2 3 4; do
            echo "=== OrangeFox source sync attempt $attempt/4 ==="
            ./orangefox_sync.sh --branch 12.1 --path "$HOME/fox_12.1"
            RC=$?
            [ "$RC" -eq 0 ] && break
            echo "WARN: sync attempt $attempt failed (rc=$RC); retrying in 30s"
            sleep 30
          done
          if [ "$RC" -ne 0 ]; then
            echo "ERROR: OrangeFox source sync failed after 4 attempts"
            exit "$RC"
          fi
          echo "OrangeFox source sync OK"
          [ -d "$HOME/fox_12.1/bootable/recovery" ] \
            || { echo "ERROR: bootable/recovery missing after sync"; exit 1; }

      - name: Place device tree
        run: |
          mkdir -p ~/fox_12.1/device/realme
          rm -rf ~/fox_12.1/device/realme/RMXTARO
          cp -r "$GITHUB_WORKSPACE" ~/fox_12.1/device/realme/RMXTARO
          echo "=== disk after source sync ==="
          df -h / || true

      - name: Inject Whiteink UI overlay into theme source
        # recovery/root/ already puts maintainer.xml into the ramdisk /sbin/
        # and our splash.xml / PNGs into /twres/. The GUI theme /twres/ is
        # assembled from gui/theme/portrait_hdpi at build time, so also seed
        # the same files into the source - this keeps the overlay reproducible
        # on every cloud build regardless of copy order.
        # This step ALSO applies four patches to the freshly synced upstream
        # sources (never committed to this repo):
        #   - indeterminate progress spinner 30fps -> 60fps
        #   - default "Recovery performance mode" Balanced -> High performance
        #   - minuitwrp/events.cpp: AIDL haptics v4 with 3-level strength
        #     mapping, RichTap waveform ladder and a runtime gain file
        #   - gui/{objects.hpp,gui.cpp,animation.cpp}: remove the real 30 fps
        #     redraw ceiling and the 500 ms input catch-up window
        # Every patch has match-count / post-condition assertions, so a
        # silently ineffective patch fails the build instead of wasting 2h.
        run: |
          ROOT="$HOME/fox_12.1"
          SRC="$GITHUB_WORKSPACE/recovery/root"
          THEME_DIR="$(find "$ROOT/bootable/recovery/gui/theme" -name ui.xml -path '*portrait_hdpi*' -printf '%h\n' 2>/dev/null | head -1)"
          if [ -n "$THEME_DIR" ] && [ -d "$THEME_DIR/images" ]; then
            mkdir -p "$THEME_DIR/images/Whiteink"
            cp -f "$SRC/twres/images/Whiteink/"*.png "$THEME_DIR/images/Whiteink/"
            cp -f "$SRC/twres/splash.xml" "$THEME_DIR/splash.xml"
            echo "Overlay seeded into $THEME_DIR (images/Whiteink + splash.xml)"

            FPS_FILES="$THEME_DIR/pages/files.xml $THEME_DIR/pages/main.xml $THEME_DIR/pages/templates/base.xml"
            FPS_COUNT=0
            for f in $FPS_FILES; do
              [ -f "$f" ] || { echo "WARN: missing $f"; continue; }
              n=$(grep -c 'fps="30"' "$f" || true)
              sed -i 's/fps="30"/fps="60"/g' "$f"
              FPS_COUNT=$((FPS_COUNT + n))
            done
            echo "patched progress animations: $FPS_COUNT (baseline 4)"
            [ "$FPS_COUNT" -ge 1 ] || { echo "ERROR: no fps=30 found in upstream theme"; exit 1; }

            SETTINGS="$THEME_DIR/pages/settings.xml"
            if [ -f "$SETTINGS" ]; then
              n=$(grep -c 'fox_boot_balance_check=1' "$SETTINGS" || true)
              sed -i 's/fox_boot_balance_check=1/fox_boot_performance_check=1/g' "$SETTINGS"
              echo "patched performance defaults: $n (baseline 2)"
              [ "$n" -ge 1 ] || { echo "ERROR: no balance fallback found in settings.xml"; exit 1; }
            else
              echo "WARN: settings.xml not found; skipping performance default patch"
            fi
          else
            echo "WARN: portrait_hdpi theme source not found; relying on recovery/root copy only"
          fi

          echo "=== Patch upstream minuitwrp haptics: v4 3-level strength mapping ==="
          EVENTS="$(find "$ROOT" -path '*/minuitwrp/events.cpp' -print -quit)"
          if [ -z "$EVENTS" ] || [ ! -f "$EVENTS" ]; then
            echo "ERROR: minuitwrp/events.cpp not found under $ROOT"
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/scripts/patch_minuitwrp_haptics.py" "$EVENTS"
          # v4 post-conditions: timeout_ms is a STRENGTH INTENT (never a 300 ms
          # on() duration), 3 levels, amplitude set BEFORE the waveform, gain
          # file so strength can be tuned without another 2 h rebuild.
          grep -q 'Effect::CLICK' "$EVENTS"
          grep -q 'Effect::HEAVY_CLICK' "$EVENTS"
          grep -q 'EffectStrength::STRONG' "$EVENTS"
          grep -q 'setAmplitude(amplitude)' "$EVENTS"
          grep -q 'std::lock_guard<std::mutex>' "$EVENTS"
          grep -q '#include <chrono>' "$EVENTS"
          grep -q '#include <mutex>' "$EVENTS"
          grep -q 'timeout_ms >= 150 ? 3 : (timeout_ms >= 50 ? 2 : 1)' "$EVENTS"
          grep -q 'kDrive\[4\]' "$EVENTS"
          grep -q 'status.isOk() && played > 0' "$EVENTS"
          grep -q 'sVib->on((uint32_t)drive_ms, nullptr).isOk()' "$EVENTS"
          grep -q '/tmp/fox_haptics_gain' "$EVENTS"
          grep -q '/tmp/fox_haptics_double' "$EVENTS"
          grep -q '/tmp/fox_haptics_force_on' "$EVENTS"
          grep -q '/tmp/fox_haptics.log' "$EVENTS"
          # Never let v1 (fixed 20 ms) or v2 (300 ms rotor buzz) come back.
          if grep -q 'sVib->on(20, nullptr)' "$EVENTS"; then
            echo "ERROR: r12 fixed-20ms fallback is back; vibration would stay weak"
            exit 1
          fi
          if grep -q 'sVib->on((uint32_t)timeout_ms, nullptr)' "$EVENTS"; then
            echo "ERROR: v2 300ms on(timeout_ms) buzz is back"
            exit 1
          fi
          if grep -q 'std::thread(' "$EVENTS" || grep -q 'vib_on_count' "$EVENTS" || grep -q 'usleep(' "$EVENTS"; then
            echo "ERROR: upstream per-tap thread path survived the haptics patch"
            exit 1
          fi
          echo "haptics patch (v4) OK: $EVENTS"

          echo "=== Patch upstream GUI framerate: remove the real 30 fps ceiling ==="
          # OrangeFox 12.1 Android.mk never forwards BoardConfig TW_FRAMERATE
          # into a -D flag. The compiled value came from gui/objects.hpp (30),
          # and gui.cpp used a 500 ms catch-up window on any input event.
          GUI="$(find "$ROOT/bootable/recovery" -path '*/gui/pages.cpp' -printf '%h\n' 2>/dev/null | head -1)"
          if [ -z "$GUI" ] || [ ! -d "$GUI" ]; then
            echo "ERROR: bootable/recovery/gui directory not found under $ROOT"
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/scripts/patch_gui_framerate.py" "$GUI"
          grep -q '#define TW_FRAMERATE 120' "$GUI/objects.hpp"
          grep -q '(got_event ? 2 : 1)' "$GUI/gui.cpp"
          grep -q 'mUpdateCount >= TW_FRAMERATE / mFPS' "$GUI/animation.cpp"
          if grep -q '#define TW_FRAMERATE 30' "$GUI/objects.hpp" || grep -q '500000000' "$GUI/gui.cpp"; then
            echo "ERROR: 30 fps default / 500 ms input window survived the framerate patch"
            exit 1
          fi
          echo "framerate patch (v4, 30 -> 120 fps ceiling) OK: $GUI"

          echo "=== Whiteink overlay verification ==="
          ls -l "$SRC/sbin/maintainer.xml" "$SRC/twres/splash.xml" "$SRC/twres/images/Whiteink/"*.png
          echo -n "custom pages: "
          grep -c '<page name=' "$SRC/sbin/maintainer.xml"
          echo -n "splash avatar hook: "
          grep -c 'whiteink_splash_avatar' "$SRC/twres/splash.xml"
          grep -q 'whiteink_splash_avatar' "$SRC/twres/splash.xml"
          echo -n "init.rc perf service: "
          grep -c 'fox_perf' "$SRC/init.recovery.qcom.rc"
          grep -q 'fox_perf' "$SRC/init.recovery.qcom.rc"
          echo "=== Whiteink hardware wiring verification ==="
          BC="$GITHUB_WORKSPACE/BoardConfig.mk"
          grep -q '^TW_FRAMERATE := 120$' "$BC"
          grep -q '^TW_SUPPORT_INPUT_AIDL_HAPTICS := true$' "$BC"
          if grep -q '^TW_SUPPORT_INPUT_AIDL_HAPTICS_FIX_OFF :=' "$BC"; then
            echo "ERROR: FIX_OFF re-enabled; per-tap std::thread would come back"
            exit 1
          fi
          if grep -q '^TW_SUPPORT_INPUT_AIDL_HAPTICS_FQNAME :=' "$BC"; then
            echo "ERROR: redundant FQNAME pin re-added; upstream default already matches"
            exit 1
          fi
          grep -q 'aw8697.ko panel_event_notifier.ko' "$BC"
          echo "framerate / AIDL haptics / no FIX_OFF / vendor modules: OK"
          # vibrator_effect.json references ABSOLUTE /odm/etc/vibrator/... paths.
          # Without a real /odm/etc in the ramdisk the RichTap HAL cannot find a
          # waveform, perform() silently fails, and we fall back to a weak on().
          ODM="$SRC/odm/etc"
          test -f "$ODM/aac_richtap.config" \
            || { echo "ERROR: /odm/etc/aac_richtap.config missing"; exit 1; }
          grep -q '/odm/etc/vibrator/809/def/effect_0.bin' "$ODM/vibrator/vibrator_effect.json" \
            || { echo "ERROR: vibrator_effect.json has no /odm/etc waveform paths"; exit 1; }
          N="$(find "$ODM/vibrator" -name 'effect_*.bin' | wc -l)"
          echo "odm/etc RichTap waveform files: $N"
          [ "$N" -ge 150 ] \
            || { echo "ERROR: /odm/etc waveform files missing; perform() would fail"; exit 1; }
          echo "odm/etc waveform dual-insurance: OK"
          test -f "$SRC/sbin/fox_refresh.sh"
          sh -n "$SRC/sbin/fox_refresh.sh"
          echo "fox_refresh.sh present and shell syntax OK"
          echo -n "init.rc refresh service: "
          grep -c 'fox_refresh' "$SRC/init.recovery.qcom.rc"
          grep -q 'service fox_refresh ' "$SRC/init.recovery.qcom.rc"
          grep -q 'wait /dev/awinic_haptic' "$SRC/init.recovery.qcom.rc"
          echo -n "vibrator service start: "
          grep -c 'start realme.vibrator' "$SRC/init.recovery.qcom.rc"

      - name: Build recovery
        # GitHub Actions runs steps with `bash -e` by default. AOSP envsetup.sh
        # is NOT -e safe: it exits silently after sourcing vendorsetup.sh, so
        # `lunch` / `mka` are never reached. Use a standalone script without -e.
        timeout-minutes: 150
        run: |
          set +e
          # Run 6 AND run 7 both froze when the streamed Actions log reached
          # ~2,110,3xx bytes (only 121 bytes apart), at 41-42% ninja progress.
          # Every stdout writer stopped at once - ninja, tee AND the heartbeat
          # - while memory (12Gi free), disk (67G free) and load (1.0) were
          # fine. That is the runner's live-log upload pipe wedging, not the
          # build. So: keep the ~28k ninja progress lines in a FILE (uploaded
          # as an artifact) and stream only a tiny heartbeat to stdout.
          cat > "$HOME/ofox_memwatch.sh" <<'WATCH'
          #!/bin/bash
          while true; do
            echo "===== HEARTBEAT $(date -u '+%H:%M:%S') ====="
            free -h
            echo "-- disk --"
            df -h / | tail -2
            echo "-- load / top RSS --"
            uptime
            ps -eo pid,ppid,stat,rss,pcpu,wchan:24,comm --sort=-rss | head -8
            LOG="$HOME/ofox_build.log"
            if [ -f "$LOG" ]; then
              LAST=$(tail -50 "$LOG" | grep -a -o '[0-9][0-9]*% [0-9][0-9]*/[0-9][0-9]*' | tail -1)
              echo "-- ninja progress: ${LAST:-n/a} --"
              AGE=$(( $(date +%s) - $(stat -c %Y "$LOG") ))
              echo "-- build output idle: ${AGE}s --"
              if [ "$AGE" -gt 1200 ] && [ ! -f "$HOME/ofox_stall_reported" ]; then
                touch "$HOME/ofox_stall_reported"
                echo "===== STALL: no build output for ${AGE}s ====="
                ps -eo pid,ppid,stat,rss,pcpu,wchan:28,comm --sort=-rss | head -25
                echo "-- ninja / clang --"
                pgrep -a -f 'ninja|clang|soong' | head -25 || true
                echo "===== STALL DIAG END ====="
              fi
            fi
            sleep 60
          done
          WATCH
          chmod +x "$HOME/ofox_memwatch.sh"

          cat > "$HOME/ofox_build.sh" <<'SCRIPT'
          #!/bin/bash
          cd "$HOME/fox_12.1" || exit 90
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export FOX_BUILD_DEVICE=RMXTARO
          # thor's BUILD.md: ccache dir permission issues break CI builds
          unset USE_CCACHE CCACHE_DIR CCACHE_EXEC CC_WRAPPER
          # Full ninja progress goes into ofox_build.log (artifact), not the
          # live Actions log - see the ~2 MiB log-pipe freeze note above.
          export NINJA_STATUS="[%p %f/%t] "
          export USE_NINJA_PROGRESS=1

          echo "===== [1/3] envsetup.sh ====="
          . build/envsetup.sh
          echo "envsetup_rc=$?"
          echo "--- functions available? ---"
          type lunch || echo "NO_LUNCH_FUNCTION"
          type mka   || echo "NO_MKA_FUNCTION"

          echo "===== [2/3] lunch ====="
          lunch twrp_RMXTARO-eng
          echo "lunch_rc=$?"
          echo "TARGET_PRODUCT=$TARGET_PRODUCT TARGET_DEVICE=$TARGET_DEVICE TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
          if [ -z "$TARGET_PRODUCT" ]; then
            echo "FATAL: lunch did not set TARGET_PRODUCT"
            exit 91
          fi

          echo "===== [3/3] mka recoveryimage (-j1, low memory) ====="
          mka recoveryimage -j1
          MKA_RC=$?
          echo "mka_rc=$MKA_RC"
          exit $MKA_RC
          SCRIPT
          chmod +x "$HOME/ofox_build.sh"

          # Only the compact heartbeat touches stdout. Redirecting the build
          # into a file keeps ~4 MB of ninja output away from the runner's
          # live-log pipe; the file's mtime is still a clean stall signal.
          : > "$HOME/ofox_build.log"
          "$HOME/ofox_memwatch.sh" &
          WATCH_PID=$!
          bash "$HOME/ofox_build.sh" >> "$HOME/ofox_build.log" 2>&1
          BUILD_RC=$?
          kill "$WATCH_PID" 2>/dev/null || true
          echo "build_script_rc=$BUILD_RC"

          echo "===== last 120 lines of build log ====="
          tail -120 "$HOME/ofox_build.log"
          IMG="$HOME/fox_12.1/out/target/product/RMXTARO/recovery.img"
          if [ -f "$IMG" ]; then
            echo "RECOVERY_IMAGE_OK: $(ls -l "$IMG")"
          else
            echo "RECOVERY_IMAGE_MISSING"
            exit 1
          fi

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: ~/ofox_build.log
          if-no-files-found: warn

      - name: Collect build outputs
        # Stage everything in a workspace-relative directory. `~/...` is NOT
        # expanded by the glob engine used by upload-artifact / gh-release,
        # so those patterns would silently match nothing.
        run: |
          set -e
          OUT="$HOME/fox_12.1/out/target/product/RMXTARO"
          DIST="$GITHUB_WORKSPACE/dist"
          rm -rf "$DIST"
          mkdir -p "$DIST"
          cp -f "$OUT/recovery.img" "$DIST/"
          echo "=== OrangeFox zip / checksums in OUT ==="
          ls -l "$OUT"/OrangeFox-*.zip "$OUT"/OrangeFox-*.zip.md5 "$OUT"/*.img.md5 2>/dev/null || true
          for f in "$OUT"/OrangeFox-*.zip "$OUT"/OrangeFox-*.zip.md5 "$OUT"/*.img.md5; do
            if [ -f "$f" ]; then cp -f "$f" "$DIST/"; fi
          done
          echo "=== dist/ ==="
          ls -lh "$DIST"
          test -s "$DIST/recovery.img"
          echo "=== sha256 ==="
          (cd "$DIST" && sha256sum *)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-RMXTARO-${{ github.run_number }}
          # recovery.img alone is NOT enough on a Virtual A/B device: after
          # fastboot flash + reboot recovery, the signed OrangeFox zip must be
          # flashed from recovery to make the install persistent.
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease with downloadable assets
        # Release assets are served from GitHub's CDN and can be downloaded
        # anonymously; Actions artifacts require a login (401 for guests).
        if: ${{ success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ofox-RMXTARO-r${{ github.run_number }}
          name: OrangeFox R12.0 · RMXTARO · run ${{ github.run_number }}
          prerelease: true
          body: |
            自动测试构建 · realme GT Neo5 / GT3（RMXTARO / senna）· OrangeFox R12.0

            含白墨工作室自定义页面（QQ 群 / 酷安 / GitHub 入口、关于页、开机画面头像），
            默认语言为简体中文。

            刷入：解锁 bootloader 后 `fastboot flash recovery recovery.img`，
            `fastboot reboot recovery`；首次进入 OrangeFox 后再刷入
            `OrangeFox-*.zip` 完成完整安装。禁止使用 `fastboot boot recovery.img`。
            刷前请备份，固件版本需与镜像匹配。
          files: |
            ${{ github.workspace }}/dist/recovery.img
            ${{ github.workspace }}/dist/OrangeFox-*.zip
            ${{ github.workspace }}/dist/OrangeFox-*.zip.md5
            ${{ github.workspace }}/dist/*.img.md5
